    <line x1="598.7" y1="630" x2="598.7" y2="634"/>
    <line x1="644.5" y1="630" x2="644.5" y2="634"/>
    <line x1="690.4" y1="630" x2="690.4" y2="634"/>
    <line x1="782.1" y1="630" x2="782.1" y2="634"/>
    <line x1="828" y1="630" x2="828" y2="634"/>
    <line x1="277.6" y1="630" x2="277.6" y2="638"/>
    <line x1="506.9" y1="630" x2="506.9" y2="638"/>
    <line x1="736.3" y1="630" x2="736.3" y2="638"/>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="277.6" y="655">04:36:05</text>
    <text x="506.9" y="655">04:36:10</text>
    <text x="736.3" y="655">04:36:15</text>
  </g>

  <!-- Notes -->
  <path d="M38,673.5 L44.5,680 L38,686.5 L31.5,680 Z" fill="#d03b3b"/>
  <text x="52" y="684" font-size="12.5" fill="#52514e">Stale write rejected: pod #2 tried to update shard 9 with range ID 15, after pod #3 had raised it to 16.</text>
  <text x="32" y="706" font-size="12.5" fill="#52514e">Times are UTC: to the second above, from log timestamps below. Other shards of pods #1 and #3 are not shown.</text>
</svg>

# Fault-injection helper: pauses every process of one pod for a number of
# seconds, then resumes it. A paused process keeps its memory and connections
# but does nothing, which is how a long stall looks to the rest of the system.
#
# The helper pod is privileged and shares the node's process namespace, which
# is what lets it signal another pod's processes. That is acceptable on a
# local test cluster only. It works for pods on the same node as the helper;
# this cluster has a single node.
#
# Usage:
#   kubectl -n temporal-lab exec deploy/freezer -- /lab/freeze.sh <pod-name> <seconds>
apiVersion: v1
kind: ConfigMap
metadata:
  name: freezer
  namespace: temporal-lab
data:
  freeze.sh: |
    #!/bin/sh
    set -eu
    if [ "$#" -lt 1 ]; then
      echo "usage: freeze.sh <pod-name> [seconds]" >&2
      exit 2
    fi
    pod="$1"
    secs="${2:-30}"

    # A container's processes carry HOSTNAME=<pod name> in their environment.
    pids=""
    for dir in /proc/[0-9]*; do
      pid="${dir#/proc/}"
      [ "$pid" = "$$" ] && continue
      if tr '\0' '\n' < "$dir/environ" 2>/dev/null | grep -qx "HOSTNAME=$pod"; then
        pids="$pids $pid"
      fi
    done
    if [ -z "$pids" ]; then
      echo "no process found for pod $pod" >&2
      exit 1
    fi

    # Prints each process's state as the kernel reports it, for example
    # "T (stopped)" while paused and "S (sleeping)" when running normally.
    states() {
      for pid in $pids; do
        echo "  pid $pid: $(grep '^State:' /proc/$pid/status | cut -f2) - $(tr '\0' ' ' < /proc/$pid/cmdline)"
      done
    }

    kill -STOP $pids
    echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) paused  $pod for ${secs}s"
    states
    sleep "$secs"
    kill -CONT $pids
    echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) resumed $pod"
    states
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freezer
  namespace: temporal-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freezer
  template:
    metadata:
      labels:
        app: freezer
    spec:
      hostPID: true
      terminationGracePeriodSeconds: 1
      containers:
        - name: freezer
          image: busybox:1.36
          command: ["sleep", "2147483647"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: scripts
              mountPath: /lab
      volumes:
        - name: scripts
          configMap:
            name: freezer
            defaultMode: 0555

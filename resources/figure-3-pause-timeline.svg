<svg xmlns="http://www.w3.org/2000/svg" width="860" height="726" viewBox="0 0 860 726" role="img" aria-labelledby="fig3-title fig3-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="fig3-title">A paused pod loses its shards after about 8 seconds and takes them back when it resumes</title>
  <desc id="fig3-desc">Two timelines for three History pods. Upper panel, 04:35:18 to 04:36:20 UTC: pod #2 holds shards 2, 5, 9, 12, 13 and 14. SIGSTOP pauses it at 04:35:33. At 04:35:41, about 8 seconds later, pod #1 acquires shards 2, 13 and 14 and pod #3 acquires shards 5, 9 and 12. SIGCONT resumes pod #2 at 04:36:03, the other two pods release the shards, and pod #2 takes them back. Lower panel, 04:36:02 to 04:36:17, one row per shard: pod #2 resumes at 04:36:03.3 and closes its stale copies of shards 2, 5, 12, 13 and 14 at once. Pod #3 releases shards 5, 9 and 12 at 04:36:03.5 and pod #1 releases shards 2, 13 and 14 at 04:36:03.7. Pod #2 re-acquires shard 12 at 04:36:03.9, shard 5 at 04:36:04.4, shard 9 at 04:36:04.5 right after its stale write to that shard is rejected, shard 14 at 04:36:05.7, shard 2 at 04:36:06.9 and shard 13 at 04:36:15.3.</desc>

  <defs>
    <marker id="fig3-arrow-end" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0.5 L8,4 L0,7.5 Z" fill="#52514e"/>
    </marker>
    <marker id="fig3-arrow-start" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0.5 L0,4 L8,7.5 Z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- Surface -->
  <rect width="860" height="726" fill="#fcfcfb"/>

  <!-- Title -->
  <text x="32" y="42" font-size="18" font-weight="600" fill="#0b0b0b">A paused pod loses its shards after about 8 seconds and takes them back when it resumes</text>
  <text x="32" y="64" font-size="13" fill="#52514e">Pod #2 held shards 2, 5, 9, 12, 13 and 14. SIGSTOP paused it for 30 seconds, and pods #1 and #3 held the shards meanwhile.</text>

  <!-- Legend -->
  <g font-size="12.5" fill="#52514e">
    <text x="32" y="93">Color shows the pod:</text>
    <rect x="170" y="82" width="12" height="12" rx="3" fill="#2a78d6"/>
    <text x="188" y="93">Pod #1</text>
    <rect x="250" y="82" width="12" height="12" rx="3" fill="#eb6834"/>
    <text x="268" y="93">Pod #2</text>
    <rect x="330" y="82" width="12" height="12" rx="3" fill="#1baf7a"/>
    <text x="348" y="93">Pod #3</text>
    <rect x="430" y="81" width="26" height="14" rx="4" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/>
    <text x="464" y="93">running</text>
    <rect x="530" y="81" width="26" height="14" rx="4" fill="#fcfcfb" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="564" y="93">paused</text>
  </g>

  <!-- ============ Upper panel: 04:35:18 to 04:36:20, x = 140 + 11.097 * (seconds after 04:35:18) ============ -->

  <!-- Event labels -->
  <g text-anchor="middle" font-size="12.5">
    <text x="306.5" y="124" font-weight="600" fill="#0b0b0b">SIGSTOP</text>
    <text x="306.5" y="140" fill="#52514e">04:35:33</text>
    <text x="395.2" y="124" font-weight="600" fill="#0b0b0b">Shards acquired</text>
    <text x="395.2" y="140" fill="#52514e">04:35:41</text>
    <text x="639.4" y="124" font-weight="600" fill="#0b0b0b">SIGCONT</text>
    <text x="639.4" y="140" fill="#52514e">04:36:03</text>
    <text x="350.8" y="163" font-size="13" font-weight="600" fill="#0b0b0b">about 8 s</text>
  </g>
  <line x1="311.5" y1="171" x2="390.2" y2="171" stroke="#52514e" stroke-width="1.25" marker-start="url(#fig3-arrow-start)" marker-end="url(#fig3-arrow-end)"/>

  <!-- Event guides, drawn behind the bars -->
  <g stroke="#898781" stroke-width="1" stroke-dasharray="3 3">
    <line x1="306.5" y1="148" x2="306.5" y2="334"/>
    <line x1="395.2" y1="148" x2="395.2" y2="334"/>
    <line x1="639.4" y1="148" x2="639.4" y2="334"/>
  </g>

  <!-- Lane labels -->
  <g font-size="14" font-weight="600" fill="#0b0b0b">
    <circle cx="38" cy="206" r="5" fill="#2a78d6"/>
    <text x="50" y="206" dy="0.35em">Pod #1</text>
    <circle cx="38" cy="254" r="5" fill="#eb6834"/>
    <text x="50" y="254" dy="0.35em">Pod #2</text>
    <circle cx="38" cy="302" r="5" fill="#1baf7a"/>
    <text x="50" y="302" dy="0.35em">Pod #3</text>
  </g>

  <!-- Pod #1: running throughout; holds shards 2, 13, 14 from 04:35:41 to 04:36:03.7 -->
  <g>
    <title>Pod #1: running. Held shards 2, 13 and 14 from 04:35:41 to 04:36:03.7.</title>
    <rect x="140" y="192" width="688" height="28" rx="6" fill="#d6e4f4" stroke="#2a78d6" stroke-width="1.5"/>
    <rect x="395.2" y="197" width="252" height="18" rx="4" fill="#9ec1ea"/>
    <text x="405" y="206" dy="0.35em" font-size="12.5" font-weight="600" fill="#0b0b0b">Holds shards 2, 13, 14</text>
  </g>

  <!-- Pod #2: running, paused 04:35:33 to 04:36:03, running again -->
  <g>
    <title>Pod #2: held its six shards until 04:35:41, 8 seconds into the pause. Paused from 04:35:33 to 04:36:03. Took the shards back from 04:36:03.9.</title>
    <rect x="140" y="240" width="165" height="28" rx="6" fill="#f9e1d7" stroke="#eb6834" stroke-width="1.5"/>
    <rect x="145" y="245" width="156" height="18" rx="4" fill="#f4b9a1"/>
    <text x="154" y="254" dy="0.35em" font-size="12.5" font-weight="600" fill="#0b0b0b">Holds its 6 shards</text>
    <rect x="308" y="240" width="330" height="28" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="312.5" y="245" width="82.7" height="18" rx="4" fill="#f4b9a1"/>
    <text x="405" y="254" dy="0.35em" font-size="12.5" fill="#0b0b0b">Paused for 30 s</text>
    <rect x="641" y="240" width="187" height="28" rx="6" fill="#f9e1d7" stroke="#eb6834" stroke-width="1.5"/>
    <rect x="649.9" y="245" width="174.1" height="18" rx="4" fill="#f4b9a1"/>
    <text x="659" y="254" dy="0.35em" font-size="12.5" font-weight="600" fill="#0b0b0b">Takes them back</text>
  </g>

  <!-- Pod #3: running throughout; holds shards 5, 9, 12 from 04:35:41 to 04:36:03.5 -->
  <g>
    <title>Pod #3: running. Held shards 5, 9 and 12 from 04:35:41 to 04:36:03.5.</title>
    <rect x="140" y="288" width="688" height="28" rx="6" fill="#d3eee4" stroke="#1baf7a" stroke-width="1.5"/>
    <rect x="395.2" y="293" width="249.7" height="18" rx="4" fill="#97d9c1"/>
    <text x="405" y="302" dy="0.35em" font-size="12.5" font-weight="600" fill="#0b0b0b">Holds shards 5, 9, 12</text>
  </g>

  <!-- Upper time axis: a minor tick every 5 s, a labelled tick every 10 s -->
  <g stroke="#c3c2b7" stroke-width="1">
    <line x1="140" y1="334" x2="828" y2="334"/>
    <line x1="217.7" y1="334" x2="217.7" y2="338"/>
    <line x1="328.6" y1="334" x2="328.6" y2="338"/>
    <line x1="439.6" y1="334" x2="439.6" y2="338"/>
    <line x1="550.6" y1="334" x2="550.6" y2="338"/>
    <line x1="661.6" y1="334" x2="661.6" y2="338"/>
    <line x1="772.5" y1="334" x2="772.5" y2="338"/>
    <line x1="162.2" y1="334" x2="162.2" y2="342"/>
    <line x1="273.2" y1="334" x2="273.2" y2="342"/>
    <line x1="384.1" y1="334" x2="384.1" y2="342"/>
    <line x1="495.1" y1="334" x2="495.1" y2="342"/>
    <line x1="606.1" y1="334" x2="606.1" y2="342"/>
    <line x1="717" y1="334" x2="717" y2="342"/>
    <line x1="828" y1="334" x2="828" y2="342"/>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="162.2" y="359">04:35:20</text>
    <text x="273.2" y="359">04:35:30</text>
    <text x="384.1" y="359">04:35:40</text>
    <text x="495.1" y="359">04:35:50</text>
    <text x="606.1" y="359">04:36:00</text>
    <text x="717" y="359">04:36:10</text>
    <text x="820" y="359">04:36:20</text>
  </g>

  <!-- Zoom callout: 04:36:02 to 04:36:17 is enlarged in the lower panel -->
  <g stroke="#c3c2b7" stroke-width="1" fill="none">
    <line x1="628.3" y1="378" x2="794.7" y2="378" stroke="#898781" stroke-width="1.25"/>
    <line x1="628.3" y1="373" x2="628.3" y2="383" stroke="#898781" stroke-width="1.25"/>
    <line x1="794.7" y1="373" x2="794.7" y2="383" stroke="#898781" stroke-width="1.25"/>
    <line x1="628.3" y1="383" x2="140" y2="424"/>
    <line x1="794.7" y1="383" x2="828" y2="424"/>
    <line x1="140" y1="424" x2="828" y2="424"/>
  </g>
  <text x="590" y="408" font-size="12" font-weight="600" fill="#52514e" text-anchor="middle">Enlarged below: 04:36:02 to 04:36:17, shard by shard</text>

  <!-- ============ Lower panel: 04:36:02 to 04:36:17, x = 140 + 45.867 * (seconds after 04:36:02) ============ -->

  <!-- Resume guide and note -->
  <line x1="200.9" y1="432" x2="200.9" y2="630" stroke="#898781" stroke-width="1" stroke-dasharray="3 3"/>
  <g font-size="12" fill="#0b0b0b">
    <text x="208" y="442">Pod #2 resumes at 04:36:03.3 and at once closes its stale copies of shards 2, 5, 12, 13 and 14.</text>
    <text x="208" y="458" fill="#52514e">Pods #3 and #1 see it return and release the shards 0.2 and 0.4 s later.</text>
  </g>

  <!-- Row labels, in the order pod #2 took the shards back -->
  <g font-size="12.5" font-weight="600" fill="#0b0b0b">
    <text x="32" y="479" dy="0.35em">Shard 12</text>
    <text x="32" y="505" dy="0.35em">Shard 5</text>
    <text x="32" y="531" dy="0.35em">Shard 9</text>
    <text x="32" y="557" dy="0.35em">Shard 14</text>
    <text x="32" y="583" dy="0.35em">Shard 2</text>
    <text x="32" y="609" dy="0.35em">Shard 13</text>
  </g>

  <g font-size="12" fill="#0b0b0b" stroke-width="1.5">
    <!-- Shard 12: pod #3 until 04:36:03.5, pod #2 from 04:36:03.9 -->
    <g>
      <title>Shard 12: pod #3 released it at 04:36:03.502. Pod #2 re-acquired it at 04:36:03.948.</title>
      <rect x="140" y="470" width="68.9" height="18" rx="5" fill="#d3eee4" stroke="#1baf7a"/>
      <text x="148" y="479" dy="0.35em">Pod #3</text>
      <rect x="229.3" y="470" width="598.7" height="18" rx="5" fill="#f9e1d7" stroke="#eb6834"/>
      <text x="239" y="479" dy="0.35em">Pod #2, from 04:36:03.9</text>
    </g>

    <!-- Shard 5: pod #3 until 04:36:03.5, pod #2 from 04:36:04.4 -->
    <g>
      <title>Shard 5: pod #3 released it at 04:36:03.502. Pod #2 re-acquired it at 04:36:04.401.</title>
      <rect x="140" y="496" width="68.9" height="18" rx="5" fill="#d3eee4" stroke="#1baf7a"/>
      <text x="148" y="505" dy="0.35em">Pod #3</text>
      <rect x="250.1" y="496" width="577.9" height="18" rx="5" fill="#f9e1d7" stroke="#eb6834"/>
      <text x="260" y="505" dy="0.35em">Pod #2, from 04:36:04.4</text>
    </g>

    <!-- Shard 9: pod #3 until 04:36:03.5; pod #2's stale write rejected at 04:36:04.522; pod #2 from 04:36:04.534 -->
    <g>
      <title>Shard 9: pod #3 released it at 04:36:03.502. Pod #2's stale write was rejected at 04:36:04.522 (range ID 15, now 16). Pod #2 re-acquired it at 04:36:04.534.</title>
      <rect x="140" y="522" width="68.9" height="18" rx="5" fill="#d3eee4" stroke="#1baf7a"/>
      <text x="148" y="531" dy="0.35em">Pod #3</text>
      <rect x="256.2" y="522" width="571.8" height="18" rx="5" fill="#f9e1d7" stroke="#eb6834"/>
      <path d="M256.2,524.5 L262.7,531 L256.2,537.5 L249.7,531 Z" fill="#d03b3b" stroke="#ffffff" stroke-width="2"/>
      <text x="270" y="531" dy="0.35em">Pod #2, from 04:36:04.5, right after its stale write was rejected</text>
    </g>

    <!-- Shard 14: pod #1 until 04:36:03.7, pod #2 from 04:36:05.7 -->
    <g>
      <title>Shard 14: pod #1 released it at 04:36:03.704. Pod #2 re-acquired it at 04:36:05.733.</title>
      <rect x="140" y="548" width="78.2" height="18" rx="5" fill="#d6e4f4" stroke="#2a78d6"/>
      <text x="148" y="557" dy="0.35em">Pod #1</text>
      <text x="264.7" y="557" dy="0.35em" fill="#52514e" text-anchor="middle">2.0 s</text>
      <rect x="311.2" y="548" width="516.8" height="18" rx="5" fill="#f9e1d7" stroke="#eb6834"/>
      <text x="321" y="557" dy="0.35em">Pod #2, from 04:36:05.7</text>
    </g>

    <!-- Shard 2: pod #1 until 04:36:03.7, pod #2 from 04:36:06.9 -->
    <g>
      <title>Shard 2: pod #1 released it at 04:36:03.704. Pod #2 re-acquired it at 04:36:06.875.</title>
      <rect x="140" y="574" width="78.2" height="18" rx="5" fill="#d6e4f4" stroke="#2a78d6"/>
      <text x="148" y="583" dy="0.35em">Pod #1</text>
      <text x="290.9" y="583" dy="0.35em" fill="#52514e" text-anchor="middle">not loaded for 3.2 s</text>
      <rect x="363.6" y="574" width="464.4" height="18" rx="5" fill="#f9e1d7" stroke="#eb6834"/>
      <text x="373" y="583" dy="0.35em">Pod #2, from 04:36:06.9</text>
    </g>

    <!-- Shard 13: pod #1 until 04:36:03.7, pod #2 from 04:36:15.3 -->
    <g>
      <title>Shard 13: pod #1 released it at 04:36:03.704. Pod #2 re-acquired it at 04:36:15.321.</title>
      <rect x="140" y="600" width="78.2" height="18" rx="5" fill="#d6e4f4" stroke="#2a78d6"/>
      <text x="148" y="609" dy="0.35em">Pod #1</text>
      <text x="430" y="609" dy="0.35em" fill="#52514e" text-anchor="middle">not loaded for 11.6 s</text>
      <text x="743" y="609" dy="0.35em" fill="#52514e" text-anchor="end">back at 04:36:15.3</text>
      <rect x="751" y="600" width="77" height="18" rx="5" fill="#f9e1d7" stroke="#eb6834"/>
      <text x="759" y="609" dy="0.35em">Pod #2</text>
    </g>
  </g>

  <!-- Lower time axis: a minor tick every second, a labelled tick every 5 s -->
  <g stroke="#c3c2b7" stroke-width="1">
    <line x1="140" y1="630" x2="828" y2="630"/>
    <line x1="140" y1="630" x2="140" y2="634"/>

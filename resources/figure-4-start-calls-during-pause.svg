<svg xmlns="http://www.w3.org/2000/svg" width="860" height="492" viewBox="0 0 860 492" role="img" aria-labelledby="fig4-title fig4-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="fig4-title">Workflow starts fail only while the paused pod still holds its shards</title>
  <desc id="fig4-desc">Timeline from 04:35:30 to 04:36:06 UTC of the load generator's start-workflow calls, issued twice a second, against the state of History pod #2. Pod #2 is paused by SIGSTOP at 04:35:33, its six shards are acquired by the other pods at 04:35:41, and SIGCONT resumes it at 04:36:03. Six start calls timed out at the 10-second limit: those issued at 04:35:34.9, 04:35:35.9, 04:35:36.9, 04:35:37.9, 04:35:39.9 and 04:35:40.4. Every other start call in the window succeeded in 18 to 38 milliseconds, including all calls issued after 04:35:41.</desc>

  <defs>
    <marker id="fig4-arrow-end" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0.5 L8,4 L0,7.5 Z" fill="#52514e"/>
    </marker>
    <marker id="fig4-arrow-start" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0.5 L0,4 L8,7.5 Z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- Surface -->
  <rect width="860" height="492" fill="#fcfcfb"/>

  <!-- Title -->
  <text x="32" y="42" font-size="18" font-weight="600" fill="#0b0b0b">Workflow starts fail only while the paused pod still holds its shards</text>
  <text x="32" y="64" font-size="13" fill="#52514e">Six of the 16 start calls issued between 04:35:33 and 04:35:41 timed out. Every later call succeeded.</text>

  <!-- Legend -->
  <g font-size="12.5" fill="#52514e">
    <circle cx="38" cy="88" r="3" fill="#52514e"/>
    <text x="50" y="93">Start succeeded in 18 to 38 ms</text>
    <rect x="262" y="82" width="26" height="12" rx="4" fill="#d03b3b"/>
    <text x="296" y="93">Start timed out at the 10 s limit, drawn from issue to failure</text>
  </g>

  <!-- Time scale: x = 140 + 19.111 * (seconds after 04:35:30) -->

  <!-- Event labels -->
  <g text-anchor="middle" font-size="12.5">
    <text x="197.3" y="124" font-weight="600" fill="#0b0b0b">SIGSTOP</text>
    <text x="197.3" y="140" fill="#52514e">04:35:33</text>
    <text x="350.2" y="124" font-weight="600" fill="#0b0b0b">Shards acquired</text>
    <text x="350.2" y="140" fill="#52514e">04:35:41</text>
    <text x="770.7" y="124" font-weight="600" fill="#0b0b0b">SIGCONT</text>
    <text x="770.7" y="140" fill="#52514e">04:36:03</text>
    <text x="273.8" y="163" font-size="13" font-weight="600" fill="#0b0b0b">about 8 s</text>
  </g>
  <line x1="202.3" y1="171" x2="345.2" y2="171" stroke="#52514e" stroke-width="1.25" marker-start="url(#fig4-arrow-start)" marker-end="url(#fig4-arrow-end)"/>

  <!-- Event guides, drawn behind the marks -->
  <g stroke="#898781" stroke-width="1" stroke-dasharray="3 3">
    <line x1="197.3" y1="148" x2="197.3" y2="404"/>
    <line x1="350.2" y1="148" x2="350.2" y2="404"/>
    <line x1="770.7" y1="148" x2="770.7" y2="404"/>
  </g>

  <!-- Row labels -->
  <circle cx="38" cy="204" r="5" fill="#eb6834"/>
  <text x="50" y="204" dy="0.35em" font-size="14" font-weight="600" fill="#0b0b0b">Pod #2</text>
  <text x="32" y="240" font-size="11" font-weight="600" fill="#898781" letter-spacing="0.6">START CALLS</text>
  <text x="32" y="258" dy="0.35em" font-size="14" font-weight="600" fill="#0b0b0b">Succeeded</text>
  <text x="32" y="337" dy="0.35em" font-size="14" font-weight="600" fill="#0b0b0b">Timed out</text>

  <!-- Pod #2: running, paused 04:35:33 to 04:36:03, running again. The darker band marks when it holds its six shards. -->
  <g>
    <title>Pod #2: paused from 04:35:33 to 04:36:03. It held its six shards until 04:35:41.</title>
    <rect x="140" y="190" width="55.8" height="28" rx="6" fill="#f9e1d7" stroke="#eb6834" stroke-width="1.5"/>
    <rect x="145" y="195" width="46.8" height="18" rx="4" fill="#f4b9a1"/>
    <rect x="198.8" y="190" width="570.4" height="28" rx="6" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="203.3" y="195" width="146.9" height="18" rx="4" fill="#f4b9a1"/>
    <text x="212" y="204" dy="0.35em" font-size="12.5" font-weight="600" fill="#0b0b0b">Holds its 6 shards</text>
    <text x="360" y="204" dy="0.35em" font-size="12.5" fill="#0b0b0b">Paused, and its shards are on pods #1 and #3</text>
    <rect x="772.2" y="190" width="55.8" height="28" rx="6" fill="#f9e1d7" stroke="#eb6834" stroke-width="1.5"/>
    <rect x="788.8" y="195" width="35.2" height="18" rx="4" fill="#f4b9a1"/>
  </g>

  <!-- Successful starts: one dot per call, 0.5 s apart. Each dotted line is a run of consecutive successes. -->
  <g stroke="#52514e" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 9.555" fill="#52514e">
    <title>Start calls that succeeded, one dot per call</title>
    <line x1="147.45" y1="258" x2="224.1" y2="258"/>
    <line x1="300.33" y1="258" x2="319.6" y2="258"/>
    <line x1="348.11" y1="258" x2="826" y2="258"/>
  </g>
  <g fill="#52514e">
    <circle cx="243" cy="258" r="3"/>
    <circle cx="262.1" cy="258" r="3"/>
    <circle cx="281.2" cy="258" r="3"/>
  </g>

  <!-- Timed-out starts: each bar runs from when the call was issued to when it failed, 10 s later -->
  <g font-size="12" fill="#52514e">
    <g>
      <title>Start 57: issued 04:35:34.890, failed after 10.000 s with "context deadline exceeded"</title>
      <rect x="233.5" y="286" width="191.1" height="12" rx="4" fill="#d03b3b"/>
      <text x="432.6" y="292" dy="0.35em">04:35:34.9 to 04:35:44.9</text>
    </g>
    <g>
      <title>Start 59: issued 04:35:35.889, failed after 10.001 s with "context deadline exceeded"</title>
      <rect x="252.5" y="304" width="191.1" height="12" rx="4" fill="#d03b3b"/>
      <text x="451.6" y="310" dy="0.35em">04:35:35.9 to 04:35:45.9</text>
    </g>
    <g>
      <title>Start 61: issued 04:35:36.890, failed after 10.000 s with "context deadline exceeded"</title>
      <rect x="271.7" y="322" width="191.1" height="12" rx="4" fill="#d03b3b"/>
      <text x="470.8" y="328" dy="0.35em">04:35:36.9 to 04:35:46.9</text>
    </g>
    <g>
      <title>Start 63: issued 04:35:37.889, failed after 10.001 s with "context deadline exceeded"</title>
      <rect x="290.8" y="340" width="191.1" height="12" rx="4" fill="#d03b3b"/>
      <text x="489.9" y="346" dy="0.35em">04:35:37.9 to 04:35:47.9</text>
    </g>
    <g>
      <title>Start 67: issued 04:35:39.890, failed after 10.000 s with "context deadline exceeded"</title>
      <rect x="329" y="358" width="191.1" height="12" rx="4" fill="#d03b3b"/>
      <text x="528.1" y="364" dy="0.35em">04:35:39.9 to 04:35:49.9</text>
    </g>
    <g>
      <title>Start 68: issued 04:35:40.389, failed after 10.000 s with "context deadline exceeded"</title>
      <rect x="338.5" y="376" width="191.1" height="12" rx="4" fill="#d03b3b"/>
      <text x="537.6" y="382" dy="0.35em">04:35:40.4 to 04:35:50.4</text>
    </g>
  </g>

  <!-- Time axis: a minor tick every second, a labelled tick every 5 s -->
  <line x1="140" y1="404" x2="828" y2="404" stroke="#c3c2b7" stroke-width="1"/>
  <line x1="139.5" y1="406" x2="828.6" y2="406" stroke="#c3c2b7" stroke-width="4" stroke-dasharray="1 18.111"/>
  <g stroke="#c3c2b7" stroke-width="1">
    <line x1="140" y1="404" x2="140" y2="412"/>
    <line x1="235.6" y1="404" x2="235.6" y2="412"/>
    <line x1="331.1" y1="404" x2="331.1" y2="412"/>
    <line x1="426.7" y1="404" x2="426.7" y2="412"/>
    <line x1="522.2" y1="404" x2="522.2" y2="412"/>
    <line x1="617.8" y1="404" x2="617.8" y2="412"/>
    <line x1="713.3" y1="404" x2="713.3" y2="412"/>
    <line x1="808.9" y1="404" x2="808.9" y2="412"/>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="140" y="429">04:35:30</text>
    <text x="235.6" y="429">04:35:35</text>
    <text x="331.1" y="429">04:35:40</text>
    <text x="426.7" y="429">04:35:45</text>
    <text x="522.2" y="429">04:35:50</text>
    <text x="617.8" y="429">04:35:55</text>
    <text x="713.3" y="429">04:36:00</text>
    <text x="808.9" y="429">04:36:05</text>
  </g>

  <!-- Notes -->
  <text x="32" y="456" font-size="12.5" fill="#52514e">Each timed-out call waited its full 10 seconds, even after the shards moved at 04:35:41.</text>
  <text x="32" y="476" font-size="12.5" fill="#52514e">Times are UTC. Calls are placed at the time the load generator issued them, from loadgen-pause.csv.</text>
</svg>
